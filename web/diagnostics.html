<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>字幕链路诊断 · 指间有声</title>
<style>body{font:16px system-ui;margin:28px auto;padding:0 20px;max-width:1100px;background:#101b2b;color:#e9f2ff}h1{font-size:25px}p{line-height:1.7;color:#afc2db}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:20px;background:#1c2e46;border-radius:12px;white-space:pre-wrap;line-height:1.8}strong{color:#63dbc0}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #3e5068;text-align:left}a{color:#63dbc0}.error{color:#ffb7ac}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>
<h1>字幕 → 手语动作：链路诊断</h1><p>每两秒刷新。收到字幕、转换成功和窗口播放是不同阶段。<a href="/">返回控制台</a></p><div class="grid"><div class="card" id="server">读取中…</div><div class="card" id="relay"></div><div class="card" id="convert"></div><div class="card" id="output"></div></div><p id="advice"></p><h2>最近进入本机的字幕</h2><table><thead><tr><th>序号</th><th>字幕</th><th>转换结果</th></tr></thead><tbody id="events"></tbody></table><p>当前优先通过观看页 WebSocket 接收中文定稿字幕。字幕接收成功和动作转换成功是两个阶段：缺词会停止该句动作，不会用随机动作替代。PHP/SRT 回调通道仍保留为备用。</p>
<script>
const el=id=>document.getElementById(id),time=t=>t?new Date(t*1000).toLocaleString():'尚无记录';
  const results={source_registered:'验签通过，已登记字幕地址',signature_or_timestamp_rejected:'验签或时间戳失败',wrong_channel:'频道号不匹配',filtered_non_original_chinese_live_subtitle:'已过滤：不是中文原声实时字幕',unsupported_srt_url:'字幕地址不符合当前允许范围'};
async function refresh(){try{const r=await fetch('/api/diagnostics');if(!r.ok)throw Error('诊断接口不可用，请重启 start.cmd');const d=await r.json(),b=d.bridge||{},s=b.relay||{},stale=!b.updated||d.now-b.updated>12;
el('server').textContent='① 保利威 → 服务器\n回调请求次数：'+(s.callback_attempts??(s.diagnostic_version===2?0:'旧版脚本没有此记录'))+'\n最后请求：'+time(s.last_callback_attempt)+'\n处理结果：'+(results[s.last_callback_result]||s.last_callback_result||'尚无有效记录')+'\n最后有效中文回调：'+time(s.last_callback)+'\n最后 SRT 新增段落：'+time(s.last_increment)+(s.fetch_error?'\nSRT 错误：'+s.fetch_error:'');
if(b.source==='watch-socket')el('server').textContent='① 直播观看页 → WebSocket\n频道：'+b.channel_id+'\n聊天登录：'+(b.login_confirmed?'已确认':'尚未确认')+'\n最近字幕消息：'+time(b.last_socket_caption)+'\n最近原文片段：'+(b.last_partial||'尚无')+'\n当前实时通道无需 PHP 回调';
el('relay').textContent='② 字幕桥接 → 本机\n桥接状态：'+(stale?'未启动或已停止，请运行 start-polyv-bridge.cmd':b.state)+'\n已接收：'+(b.received_count||0)+' 条\n进入动作队列：'+(b.forwarded_count||0)+' 条\n其中片段演示：'+(b.partial_count||0)+' 条\n缺词失败：'+(b.unsupported_count||0)+' 条\n最后送入本机：'+time(b.last_delivered)+(b.error?'\n连接错误：'+b.error:'');
const latest=d.events.at(-1);el('convert').textContent='③ 本机动作转换\n'+(latest?'最后字幕：'+latest.text+'\n结果：'+(latest.error||latest.method+'，'+latest.frames+' 帧'):'尚无字幕进入本机')+(b.conversion_error?'\n最近桥接转换失败：'+b.conversion_error:'');
el('output').textContent='④ 独立输出窗口\n'+(d.outputs.length?d.outputs.map((o,i)=>'窗口 '+(i+1)+'：'+(o.ready?'模型已就绪':'模型加载中/失败')+'；'+(o.playing?'正在播放动作':'等待动作')+'；最后播放序号 '+(o.last_seq??'无')).join('\n'):'未检测到输出页心跳。新功能需刷新已开的输出窗口，或关闭后重新运行 open-capture-window.cmd');
el('events').replaceChildren();for(const e of d.events.slice().reverse()){const tr=document.createElement('tr');for(const text of [e.seq,e.text,e.error||e.method+' / '+e.frames+'帧'+(e.warning?'；'+e.warning:'')]){const td=document.createElement('td');td.textContent=text;tr.append(td)}el('events').append(tr)}
el('advice').textContent=stale?'当前先启动本机字幕桥接。':b.source==='watch-socket'?(b.error?'请检查观看连接错误。':!b.login_confirmed?'正在等待聊天登录确认。':!b.received_count?'聊天已登录，等待中文定稿字幕。':b.unsupported_count?'字幕已经到达本机；缺词的句子不能转换动作，请查看下方记录。':'字幕已接入，请检查动作转换和输出窗口。'):s.diagnostic_version!==2?'服务器仍是旧版；上传诊断更新包中的三个 PHP 文件，可区分未收到、验签失败和被过滤。':!s.last_callback_attempt?'服务器尚未记录到回调请求。检查保利威通知时机及服务器 access.log；直播间有字幕不代表逐句回调已发生。':s.last_callback_result!=='source_registered'?'先处理第一段显示的拒绝/过滤原因。':!s.last_increment?'已登记 SRT，正在等待新增段落；初次历史内容不会自动回放。':'已有字幕增量，继续检查第三段缺词提示与第四段窗口心跳。';
}catch(e){el('advice').textContent=e.message}setTimeout(refresh,2000)}refresh();
</script></html>
